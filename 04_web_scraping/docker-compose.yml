services:
  mongodb:
    image: mongo:7.0
    container_name: toscrape_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - toscrape_network

volumes:
  mongodb_data:
    name: mongodb_data

networks:
  toscrape_network:
    name: toscrape_network